# Evidence-poisoning experiment: each of the 27 sampled cases is run under
# two system configurations (single-pass RAG and the full pipeline), always
# on corrupted evidence; the two tampering modes are `tamper` and `append`.
experiment: injection
seed: 42
cases: 27

model:
  name: glm-5.3-flash
  base_url: https://open.bigmodel.cn/api/paas/v4
  temperature: 0.1
  top_p: 0.8
  max_new_tokens: 3072

pricing:                       # API credits were donated; cost is logged as 0
  PRICE_IN_PER_M: 0
  PRICE_OUT_PER_M: 0

data:
  path: data/bigdata_error_cases_500_en.csv
