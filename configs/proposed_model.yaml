# Full pipeline (Proposer -> Reviser -> Checker). This is the configuration
# used for every number reported in the paper.
experiment: proposed_model
seed: 42

model:
  name: glm-5.3-flash          # any OpenAI-compatible chat model
  base_url: https://open.bigmodel.cn/api/paas/v4
  temperature: 0.1
  top_p: 0.8
  max_new_tokens: 3072         # provider forces "thinking"; 3072 is the minimum
                               # length that reliably returns non-empty content
  empty_output_retry_tokens: 8192

retrieval:
  mode: oracle_evidence        # experiments consume the evidence span shipped
                               # with each case; the BM25+Chroma index is a
                               # design component and is not queried at eval time
  top_k: 5
  fusion: 0.5                  # BM25 weight, 1-fusion for the dense side
  similarity_threshold: 0.7    # design value for the Chroma side; NOT applied at
                               # eval time (oracle evidence is used instead)

data:
  path: data/bigdata_error_cases_500_en.csv
  split: {kb: 400, test: 100}
  components: [hadoop, spark, hive, hbase]

pricing:                       # API credits were donated; cost is logged as 0
  PRICE_IN_PER_M: 0
  PRICE_OUT_PER_M: 0
